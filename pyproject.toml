[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "oracle-db-migration-generator"
version = "0.1.0"
description = "Oracle migration planning CLI - read-only comparison and local SQL/JSON/HTML artifacts"
requires-python = ">=3.11,<3.14"
dependencies = ["jsonschema==4.26.0", "oracledb==26.0.1", "antlr4-python3-runtime==4.13.2", "Jinja2==3.1.6"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "build>=1.2,<2"]
ui = ["fastapi==0.162.0", "uvicorn==0.54.0", "httpx==0.28.1", "cryptography==50.0.2"]

[project.scripts]
oracle-db-migration-generator = "oracle_db_migration_generator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
oracle_db_migration_generator = ["schemas/*.json", "_vendor/analyzer_core/taxonomy/*.json", "_vendor/analyzer_core/oracle/generated/manifest.json", "_vendor/analyzer_core/licenses/*", "reporting/templates/*.j2", "reporting/assets/*", "portable/templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
